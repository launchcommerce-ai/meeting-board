<!DOCTYPE html>
<html>
<head>
  <title>Launch Commerce Task Board</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .header { background: #0a1f44; color: white; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; }
    input, select { padding: 10px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    button { padding: 10px 20px; background: #ff7a1a; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #e66f0f; }
    .task { padding: 10px; background: #f9f9f9; margin: 10px 0; border-left: 3px solid #ff7a1a; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat { text-align: center; padding: 15px; background: white; border-radius: 8px; border: 1px solid #ddd; }
    .stat-num { font-size: 24px; font-weight: bold; color: #0a1f44; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Launch Commerce Task Board</h1>
    <p>Real-time task management powered by Fathom</p>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="open">0</div>
      <div>Open</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="done">0</div>
      <div>Done</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="total">0</div>
      <div>Total</div>
    </div>
  </div>

  <div class="card">
    <h2>Add Task</h2>
    <input type="text" id="title" placeholder="Task description">
    <select id="person">
      <option>Greg</option>
      <option>Luisa</option>
      <option>Yvonne</option>
      <option>Candice</option>
      <option>Joshua</option>
    </select>
    <select id="priority">
      <option value="3">Priority 3</option>
      <option value="1">Priority 1</option>
      <option value="2">Priority 2</option>
      <option value="4">Priority 4</option>
      <option value="5">Priority 5</option>
    </select>
    <button onclick="addTask()">+ Add</button>
    <div id="status" style="margin-top: 10px; font-size: 12px;"></div>
  </div>

  <div class="card">
    <h2>Tasks</h2>
    <div id="tasks">Loading...</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

  <script>
    const config = {
      apiKey: "AIzaSyAAAX_IMv6BHmQJP3FjCKmcnlSnAbaDjsw",
      authDomain: "fathom-meeting-board.firebaseapp.com",
      projectId: "fathom-meeting-board",
      storageBucket: "fathom-meeting-board.firebasestorage.app",
      messagingSenderId: "436112664902",
      appId: "1:436112664902:web:2854f7bca613a915e95d47",
      databaseURL: "https://fathom-meeting-board-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(config);
    const db = firebase.database();

    function addTask() {
      const title = document.getElementById('title').value;
      const person = document.getElementById('person').value;
      const priority = document.getElementById('priority').value;
      
      if (!title) {
        document.getElementById('status').innerHTML = '<span style="color: red;">Enter a task</span>';
        return;
      }

      db.ref('tasks').push({
        title: title,
        assignee: person,
        priority: parseInt(priority),
        completed: false,
        created_at: Date.now()
      }).then(() => {
        document.getElementById('title').value = '';
        document.getElementById('status').innerHTML = '<span style="color: green;">Task added!</span>';
        setTimeout(() => { document.getElementById('status').innerHTML = ''; }, 2000);
      }).catch(err => {
        document.getElementById('status').innerHTML = '<span style="color: red;">Error: ' + err.message + '</span>';
      });
    }

    function loadTasks() {
      db.ref('tasks').on('value', (snapshot) => {
        const tasks = [];
        let open = 0, done = 0;
        
        if (snapshot.exists()) {
          snapshot.forEach((child) => {
            const task = child.val();
            task.id = child.key;
            tasks.push(task);
            if (task.completed) done++; else open++;
          });
        }

        document.getElementById('open').textContent = open;
        document.getElementById('done').textContent = done;
        document.getElementById('total').textContent = tasks.length;

        const html = tasks.length === 0 ? '<div style="color: #999;">No tasks</div>' : 
          tasks.map(t => `<div class="task"><strong>${t.title}</strong><br><small>${t.assignee} • Priority ${t.priority}</small></div>`).join('');
        
        document.getElementById('tasks').innerHTML = html;
      });
    }

    loadTasks();
  </script>
</body>
</html>
